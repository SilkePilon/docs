server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Next.js static export writes /docs/foo.html (and sometimes a /docs/foo/
    # folder next to it), so try the .html file before the folder.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build assets never change.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static search index (no file extension).
    location = /api/search {
        default_type application/json;
    }

    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
}
